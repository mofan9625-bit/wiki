name: Build and submit IndexNow URLs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static site
        run: npm run build

      - name: Verify IndexNow key is in the site root
        shell: bash
        run: |
          test -f fcdb12bade2a7909f8c2599837713f86.txt
          test "$(tr -d '\r\n' < fcdb12bade2a7909f8c2599837713f86.txt)" = "fcdb12bade2a7909f8c2599837713f86"

      - name: Submit sitemap URLs to IndexNow
        run: npm run indexnow:submit
